<!doctype html>
<meta charset="utf-8" />
<title>YT-Speed · 引擎验证</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 28px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: #8b949e; margin: 0 0 20px; font-size: 13px; }
  button { font: inherit; padding: 7px 16px; margin-right: 8px; border-radius: 7px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
  button:hover { background: #30363d; }
  button:disabled { opacity: .45; cursor: default; }
  #out { margin-top: 22px; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 190px 1fr; padding: 3px 0; }
  .k { color: #8b949e; }
  .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
  #log { margin-top: 18px; font: 12px/1.5 ui-monospace, monospace; color: #8b949e; white-space: pre-wrap; max-height: 220px; overflow: auto; }
  #bar { height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; margin: 14px 0 0; }
  #bar > i { display: block; height: 100%; width: 0; background: #2f81f7; transition: width .1s linear; }
</style>
<h1>P3 引擎验证</h1>
<p class="hint">引擎跑在 Web Worker 里；这个页面只负责收快照。仅用于阶段验证，正式 UI 是 P4 的 Leptos。<br>
「实测」= 收到字节 / 耗时，不做任何补偿；「上游口径」= 乘 1.06 的传输开销补偿，只为与 LibreSpeed 的数字可比。两个都摆出来，不替谁圆场。</p>

<button id="run">开始（ping → 下载 → 上传）</button>
<button id="dl" disabled>只测下载</button>
<button id="ul" disabled>只测上传（WS）</button>
<button id="ulxhr" disabled>只测上传（XHR 降级）</button>
<button id="abort" disabled>取消</button>

<div id="bar"><i></i></div>
<div id="out">
  <div class="row"><span class="k">阶段</span><span id="phase">—</span></div>
  <div class="row"><span class="k">当前速率（实测）</span><span class="big" id="status">—</span></div>
  <div class="row"><span class="k">上游口径（×1.06）</span><span id="status_raw">—</span></div>
  <div class="row"><span class="k">进度</span><span id="progress">—</span></div>
  <div class="row"><span class="k">字节</span><span id="bytes">—</span></div>
  <div class="row"><span class="k">ping / jitter</span><span id="ping">—</span></div>
  <div class="row"><span class="k">下载结果</span><span id="dlres">—</span></div>
  <div class="row"><span class="k">上传结果</span><span id="ulres">—</span></div>
  <div class="row"><span class="k">上传通道</span><span id="ulmode">—</span></div>
  <div class="row"><span class="k">采样点数</span><span id="npts">—</span></div>
</div>
<div id="log"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const worker = new Worker('./engine.worker.js', { type: 'module' });
let started = 0;
let frames = 0;

function log(line) {
  $('log').textContent += line + '\n';
  $('log').scrollTop = $('log').scrollHeight;
}

worker.onmessage = (ev) => {
  const msg = ev.data;
  if (msg.type === 'frame') {
    frames++;
    const f = msg.frame;
    $('phase').textContent = f.phase;
    // 实测值在前，上游口径在后：页面上第一眼看到的必须是真的字节速率
    $('status').textContent = f.status_raw ? f.status_raw + ' Mbit/s' : '—';
    $('status_raw').textContent = f.status ? f.status + ' Mbit/s' : '—';
    $('progress').textContent = (f.progress * 100).toFixed(0) + '%';
    $('bar').firstElementChild.style.width = (f.progress * 100).toFixed(1) + '%';
    $('bytes').textContent = (f.bytes / 1048576).toFixed(1) + ' MiB';
    $('ulmode').textContent = f.upload_mode === 'xhr' ? 'XHR（降级，客户端计数）' : 'WebSocket（服务端结算）';
    $('ping').textContent = (f.ping ?? '—') + ' / ' + (f.jitter ?? '—');
  } else if (msg.type === 'done') {
    const f = msg.frame;
    const ms = performance.now() - started;
    const both = (raw, comp) =>
      raw == null ? '—' : `${raw.toFixed(2)} Mbit/s（上游口径 ${comp.toFixed(2)}）`;
    $('dlres').textContent = both(f.download_mbps_raw, f.download_mbps);
    $('ulres').textContent = both(f.upload_mbps_raw, f.upload_mbps);
    $('npts').textContent = msg.samples.length + ' 点';
    $('phase').textContent = f.phase;
    const dl = f.download_mbps_raw != null
      ? `${f.download_mbps_raw.toFixed(2)}（实测）/ ${f.download_mbps.toFixed(2)}（×1.06）` : '—';
    const ul = f.upload_mbps_raw != null
      ? `${f.upload_mbps_raw.toFixed(2)}（实测）/ ${f.upload_mbps.toFixed(2)}（×1.06）` : '—';
    log(`完成：${(ms / 1000).toFixed(2)} s，${frames} 帧，phase=${f.phase}，failed=${f.failed}，` +
        `ping=${f.ping} jitter=${f.jitter}，下载=${dl} 上传=${ul} Mbit/s，采样=${msg.samples.length}` +
        // failed 时把原因一起打出来（远程机器开不了 devtools）
        (msg.error ? `\n失败原因：${msg.error}` : ''));
    // 给自动化脚本读的汇总
    document.title = `done ${f.download_mbps?.toFixed(2)} ${f.upload_mbps?.toFixed(2)} ${msg.samples.length}`;
    window.__result = {
      download_mbps: f.download_mbps,
      upload_mbps: f.upload_mbps,
      download_mbps_raw: f.download_mbps_raw,
      upload_mbps_raw: f.upload_mbps_raw,
      ping: f.ping,
      jitter: f.jitter,
      failed: f.failed,
      error: msg.error || null,
      samples: msg.samples.length,
      wall_ms: ms,
      frames,
    };
    setBusy(false);
  }
};

function setBusy(busy) {
  $('run').disabled = busy;
  $('dl').disabled = busy;
  $('ul').disabled = busy;
  $('ulxhr').disabled = busy;
  $('abort').disabled = !busy;
  $('ulxhr').disabled = busy;
  if (busy) {
    started = performance.now();
    frames = 0;
    window.__result = null;
    $('dlres').textContent = $('ulres').textContent = $('npts').textContent = '—';
  }
}

function run(plan) {
  const base = location.origin;
  setBusy(true);
  log('start base=' + base + ' plan=' + JSON.stringify(plan));
  worker.postMessage({ cmd: 'start', base, plan });
}

// 自动化对照测试用：把 run 暴露出去，便于同一页面交替驱动两套引擎
window.__run = run;
$('run').onclick = () => run({ ping: true, download: true, upload: true });
$('dl').onclick = () => run({ ping: false, download: true, upload: false, streams: 8 });
$('ul').onclick = () => run({ ping: false, download: false, upload: true });
$('ulxhr').onclick = () => run({ ping: false, download: false, upload: true, xhr: true });
$('abort').onclick = () => worker.postMessage({ cmd: 'abort' });

// 页面切到后台/锁屏时立刻掐流：手机锁屏会让定时器停摆，引擎走不到 Done，
// 那 10 条 stream=1 的下载流会一直读下去（实测服务端持续 400 Mbit/s 往外写）。
document.addEventListener('visibilitychange', () => {
  if (document.hidden) worker.postMessage({ cmd: 'stop' });
});
window.addEventListener('pagehide', () => worker.postMessage({ cmd: 'stop' }));

// 自动化入口：?auto=1 直接开跑完整测试
if (new URLSearchParams(location.search).get('auto')) {
  setTimeout(() => run({ ping: true, download: true, upload: true }), 200);
}
setTimeout(() => setBusy(false), 0);
</script>
