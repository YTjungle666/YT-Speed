<!doctype html>
<meta charset="utf-8" />
<title>P3 对照：上游 legacy vs 新引擎（1 Gbps 限速）</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #8b949e; margin: 0 0 16px; }
  button { font: inherit; padding: 7px 16px; border-radius: 7px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid #21262d; padding: 4px 14px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #sum { margin-top: 16px; font-weight: 600; }
  #stage { color: #8b949e; margin-top: 8px; }
</style>
<h1>P3 对照测试</h1>
<p>
上游 LibreSpeed v6.3.1（<code>speedtest.js</code>，XHR 多流）与本引擎（fetch 流式 + WS）交替跑同一服务端。
服务端限速 1 Gbps（聚合口径），每轮各测 6 s 下载 + 6 s 上传；两边都按各自 ×1.06 口径对比。结果每轮写入 localStorage，标签页崩了也不丢。
</p>
<button id="go">开始 20 轮</button>
<div id="stage">就绪</div>
<table id="tbl">
  <thead><tr><th>轮次</th><th>legacy 下载（含×1.06）</th><th>新引擎下载（含×1.06）</th><th>Δ</th><th>legacy 上传（含×1.06）</th><th>新引擎上传（含×1.06）</th><th>Δ</th></tr></thead>
  <tbody></tbody>
</table>
<div id="sum"></div>

<script src="/legacy/speedtest.js"></script>
<script type="module">
// ?rounds=N 可改轮数（本机调试用；正式验收是 20 轮）
const RUNS = Number(new URLSearchParams(location.search).get('rounds') || 20);
const DL_SECS = 6;
const UL_SECS = 6;
const KEY = 'p3cmp';
const $ = (id) => document.getElementById(id);

// ---------------- 新引擎（wasm worker） ----------------
const worker = new Worker('./engine.worker.js', { type: 'module' });
let pending = null;
// 预热 wasm：必须在任何测试之前完成，否则第一次 init 会和遗留连接抢
// 浏览器“每主机 6 个连接”的名额，一直挂到超时（这一版就被它坑过）。
let warmed = false;
let warmResolve = null;
const warm = new Promise((res) => { warmResolve = res; });
worker.onmessage = (ev) => {
  const msg = ev.data;
  if (msg.type === 'init-done') { warmed = true; if (warmResolve) warmResolve('ok'); return; }
  if (msg.type === 'error') {
    $('stage').textContent = 'worker 报错：' + msg.where + ' — ' + msg.message;
    if (!warmed && warmResolve) warmResolve('fail');
    if (pending) { const done = pending; pending = null; done({ dl: null, ul: null, error: msg.message }); }
    return;
  }
  if (msg.type === 'done' && pending) {
    const f = msg.frame;
    const r = {
      dl: f.download_mbps_raw,
      ul: f.upload_mbps_raw,
      dl_c: f.download_mbps,
      ul_c: f.upload_mbps,
      mode: f.upload_mode,
    };
    const done = pending;
    pending = null;
    done(r);
  }
};
function runMine() {
  return new Promise((resolve) => {
    pending = resolve;
    worker.postMessage({
      cmd: 'start',
      base: location.origin,
      plan: { ping: false, download: true, upload: true, streams: 8, dl_seconds: DL_SECS, ul_seconds: UL_SECS },
    });
  });
}

// ---------------- 上游 legacy ----------------
function runLegacy() {
  return new Promise((resolve) => {
    const t = new Speedtest();
    t.setParameter('telemetry_level', 'off');
    t.setParameter('url_dl', '/backend/garbage.php');
    t.setParameter('url_ul', '/backend/empty.php');
    t.setParameter('url_ping', '/backend/empty.php');
    t.setParameter('url_getIp', '/backend/getIP.php');
    t.setParameter('time_dl_max', DL_SECS);
    t.setParameter('time_ul_max', UL_SECS);
    t.setParameter('time_auto', false);
    t.setParameter('time_dlGraceTime', 0);
    t.setParameter('time_ulGraceTime', 0);
    let last = {};
    t.onupdate = (d) => { last = { dl: Number(d.dlStatus), ul: Number(d.ulStatus) }; };
    t.onend = () => setTimeout(() => resolve(last), 50);
    t.start();
  });
}

// 单轮超时保护：卡住就记 null，继续下一轮，不让整批停摆
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((r) => setTimeout(() => r({ dl: null, ul: null, timeout: true }), ms))]);
}

const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
};
const save = (rows) => localStorage.setItem(KEY, JSON.stringify(rows));

function render(rows) {
  const tb = $('tbl').querySelector('tbody');
  tb.innerHTML = '';
  for (const r of rows) {
    const d = (a, b) => (a && b ? (((b - a) / a) * 100).toFixed(1) + '%' : '—');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.r}</td><td>${r.ldl?.toFixed(2) ?? '—'}</td><td>${r.ndl?.toFixed(2) ?? '—'}</td>` +
      `<td>${d(r.ldl, r.ndl)}</td><td>${r.lul?.toFixed(2) ?? '—'}</td><td>${r.nul?.toFixed(2) ?? '—'}</td><td>${d(r.lul, r.nul)}</td>`;
    tb.appendChild(tr);
  }
  const med = (xs) => {
    const a = xs.filter((x) => typeof x === 'number' && isFinite(x)).sort((x, y) => x - y);
    if (!a.length) return null;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  const ml = med(rows.map((r) => r.ldl)), mn = med(rows.map((r) => r.ndl));
  const ul = med(rows.map((r) => r.lul)), un = med(rows.map((r) => r.nul));
  const pct = (a, b) => (a && b ? (((b - a) / a) * 100).toFixed(2) : '—');
  $('sum').textContent = rows.length
    ? `已完成 ${rows.length} 轮｜下载中位：legacy ${ml?.toFixed(2)} / 新引擎 ${mn?.toFixed(2)}（偏差 ${pct(ml, mn)}%）｜` +
      `上传中位：legacy ${ul?.toFixed(2)} / 新引擎 ${un?.toFixed(2)}（偏差 ${pct(ul, un)}%）`
    : '';
}

let busy = false;
async function runAll() {
  if (busy) return;
  busy = true;
  $('go').disabled = true;
  $('stage').textContent = '预热 wasm...';
  if ((await warm) !== 'ok') { busy = false; $('go').disabled = false; return; }
  let rows = load();
  while (rows.length < RUNS) {
    const r = rows.length + 1;
    $('stage').textContent = `第 ${r}/${RUNS} 轮：legacy...`;
    const l = await withTimeout(runLegacy(), 45000);
    $('stage').textContent = `第 ${r}/${RUNS} 轮：新引擎...`;
    const n = await withTimeout(runMine(), 45000);
    // 注意：legacy 的 dlStatus/ulStatus 自带 ×1.06 补偿，所以口径对照要用
    // 我们的补偿值（dl_c/ul_c），原始值单独留着看。
    rows.push({
      r,
      ldl: l.dl, lul: l.ul,
      ndl_raw: n.dl, nul_raw: n.ul,
      ndl: n.dl_c, nul: n.ul_c,
      mode: n.mode, t: Date.now(),
    });
    save(rows);
    render(rows);
  }
  $('stage').textContent = '全部完成';
  $('go').disabled = false;
  busy = false;
}

$('go').onclick = () => { localStorage.removeItem(KEY); render([]); runAll(); };
// 页面一打开就让 worker 把 wasm 拉下来（只有一条请求，不占下载连接）
worker.postMessage({ cmd: 'init' });
render(load());
if (new URLSearchParams(location.search).get('auto')) {
  localStorage.removeItem(KEY);
  render([]);
  runAll();
}
window.__cmp = load;
window.__runAll = runAll;
// 调试出口：单跑某一侧、看内部状态（正式使用不需要）
window.__runMine = runMine;
window.__runLegacy = runLegacy;
window.__state = () => ({ warmed, pending: !!pending, rows: load().length });
</script>
