[workspace]
members = ["crates/speedtest-core", "crates/speedtest-server", "crates/speedtest-transport", "crates/speedtest-wasm", "crates/speedtest-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
speedtest-core = { path = "crates/speedtest-core" }
speedtest-transport = { path = "crates/speedtest-transport" }

# wasm 目标释放大小，native 目标保持默认优化
[profile.release]
opt-level = 3
lto = "thin"
