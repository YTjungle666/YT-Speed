[workspace]
members = ["crates/speedtest-core", "crates/speedtest-server", "crates/speedtest-transport"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
speedtest-core = { path = "crates/speedtest-core" }
