[package]
name = "speedtest-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "浏览器侧引擎（Web Worker + wasm）：fetch 流式下载 / WebSocket 上传"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
speedtest-core.workspace = true
speedtest-transport.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
  "AbortController", "AbortSignal", "BinaryType", "DedicatedWorkerGlobalScope",
  "ErrorEvent", "MessageEvent", "Performance", "ReadableStream",
  "ReadableStreamDefaultReader", "Request", "RequestCache", "RequestInit",
  "Response", "WebSocket", "WorkerGlobalScope",
]
