# 10GbE 测速服务端的宿主侧内核参数（放在 /etc/sysctl.d/99-speedtestd.conf）
#
# 这些不是“调优魔法”，而是让内核不要在测速时替我们做决定：
# - 接收队列：容器 veth 默认 1000，突发下会丢包（P0 出现过 RX dropped 35 万）；
# - 缓冲上限：10 Gbit/s × 0.3 ms RTT 只需要 ~400 KB，但突发需要更多余量；
# - 端口范围：8 路并发 + 浏览器重连，默认够用，保留以便压测。

# 单队列 backlog（容器内不可改，需在宿主侧/CT 宿主设置）
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 4096

# 收发缓冲上限（默认 208 KB 在万兆下会限速）
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# 万兆低延迟：开启窗口缩放与时间戳（默认已开，显式写出来方便审计）
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# 队列调度用 fq，配合 BBR/BBRv3 时突发更平滑；仅当内核支持才生效
# net.core.default_qdisc = fq
# net.ipv4.tcp_congestion_control = bbr
#
# 注意：PLAN §0.5 的结论是“客户端接收窗口才是浏览器下载的上限”，
# 上面这些参数只影响服务端能不能及时把数据交给网卡，不会突破那个上限。
